<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wie is online?</title>

<style>
body{
  background:#061522;
  color:#fff;
  font:16px Arial;
  margin:0;
}

.p{
  max-width:1400px;
  margin:30px auto;
  background:#0b2639;
  padding:25px;
  border-radius:15px;
}

.tables{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

table{
  width:100%;
  border-collapse:collapse;
}

td,th{
  padding:14px;
  border-bottom:1px solid #28506a;
  text-align:left;
}

.on{
  color:#5de18a;
}

.off{
  color:#ff6574;
}

/* ZOEKVAK */

.zoekvak{
  width:100%;
  max-width:500px;
  box-sizing:border-box;
  padding:14px 16px;
  margin:5px 0 25px;
  border:1px solid #28506a;
  border-radius:10px;
  background:#061522;
  color:white;
  font-size:16px;
  outline:none;
}

.zoekvak:focus{
  border-color:#5de1ff;
}

/* CHAT */

.chat{
  margin-top:35px;
  padding:20px;
  background:#061522;
  border:1px solid #28506a;
  border-radius:15px;
}

.chat h2{
  color:#5de1ff;
  margin-top:0;
}

.chatberichten{
  height:320px;
  overflow-y:auto;
  background:#0b2639;
  border:1px solid #28506a;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
}

.bericht{
  padding:10px;
  margin-bottom:10px;
  border-bottom:1px solid #28506a;
}

.berichtnaam{
  color:#5de18a;
  font-weight:bold;
}

.tijd{
  color:#9bb3c3;
  font-size:12px;
  margin-left:8px;
}

.chatvelden{
  display:grid;
  grid-template-columns:180px 1fr auto;
  gap:10px;
}

.chatvelden input{
  padding:13px;
  border-radius:8px;
  border:1px solid #28506a;
  background:#0b2639;
  color:white;
  font-size:16px;
}

.chatvelden button{
  padding:13px 22px;
  border:0;
  border-radius:8px;
  background:#5de18a;
  color:#061522;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.chatvelden button:hover{
  opacity:.9;
}

.chatstatus{
  color:#ff6574;
  min-height:20px;
  margin-top:10px;
}

.logo{
  display:block;
  max-width:260px;
  width:100%;
  height:auto;
  margin:30px auto;
  border-radius:12px;
}

@media(max-width:900px){

  .tables{
    grid-template-columns:1fr;
  }

  .chatvelden{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<h2 style="text-align:center;color:#5de1ff;font-size:28px;">
ALWAYS CONNECTED BY POC RADIO BE
</h2>

<div class="p">

<h1>POC RADIO BE</h1>
<h2>Wie is online?</h2>

<input
  type="text"
  id="zoek"
  class="zoekvak"
  placeholder="🔍 Zoek op naam..."
  autocomplete="off"
>

<div class="tables">

<table>
<thead>
<tr>
<th>Naam</th>
<th>Status</th>
<th>Laatst online</th>
</tr>
</thead>
<tbody id="r1"></tbody>
</table>

<table>
<thead>
<tr>
<th>Naam</th>
<th>Status</th>
<th>Laatst online</th>
</tr>
</thead>
<tbody id="r2"></tbody>
</table>

</div>

<p>IMEI, batterij en GPS worden niet openbaar getoond.</p>


<!-- CHATBOX -->

<div class="chat">

<h2>💬 POC RADIO BE Chat</h2>

<div id="chatberichten" class="chatberichten">
  Chat laden...
</div>

<div class="chatvelden">

<input
  type="text"
  id="chatnaam"
  maxlength="40"
  placeholder="Naam / roepnaam"
>

<input
  type="text"
  id="chatbericht"
  maxlength="500"
  placeholder="Typ hier je bericht..."
>

<button onclick="verstuurBericht()">
Versturen
</button>

</div>

<div id="chatstatus" class="chatstatus"></div>

</div>

</div>


<img
src="616338863_122119169199130837_2862670572946327472_n (1).jpg"
alt="POC RADIO BE"
class="logo"
>


<script>

const e = s => String(s ?? '').replace(
  /[&<>"]/g,
  c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;'
  }[c])
);


/* =========================
   RADIO LIJST
========================= */

let alleRadios = [];


function maakRijen(radios){

  return radios.map(x => `

    <tr>

      <td>${e(x.name)}</td>

      <td class="${x.status === 'online' ? 'on' : 'off'}">

        ${x.status === 'online'
          ? '🟢 Online'
          : '🔴 Offline'}

      </td>

      <td>${e(x.last_seen || '-')}</td>

    </tr>

  `).join('');

}


function toonRadios(radios){

  const helft =
    Math.ceil(radios.length / 2);

  const links =
    radios.slice(0, helft);

  const rechts =
    radios.slice(helft);


  if(radios.length === 0){

    document.getElementById('r1').innerHTML =
      '<tr><td colspan="3">Geen radio gevonden.</td></tr>';

    document.getElementById('r2').innerHTML = '';

    return;
  }


  document.getElementById('r1').innerHTML =
    maakRijen(links);

  document.getElementById('r2').innerHTML =
    maakRijen(rechts);

}


async function laadRadios(){

  try{

    const response =
      await fetch('/api/public/radios');

    const radios =
      await response.json();

    alleRadios = radios;

    zoekRadio();

  }
  catch(fout){

    document.getElementById('r1').innerHTML =
      '<tr><td colspan="3">Kan de radiolijst niet laden.</td></tr>';

    document.getElementById('r2').innerHTML = '';

  }

}


function zoekRadio(){

  const zoektekst =
    document
      .getElementById('zoek')
      .value
      .toLowerCase()
      .trim();


  if(!zoektekst){

    toonRadios(alleRadios);
    return;

  }


  const gevonden =
    alleRadios.filter(radio =>

      String(radio.name || '')
        .toLowerCase()
        .includes(zoektekst)

    );


  toonRadios(gevonden);

}


document
.getElementById('zoek')
.addEventListener(
  'input',
  zoekRadio
);


/* =========================
   CHAT
========================= */


async function laadChat(){

  try{

    const response =
      await fetch('/api/chat');

    const berichten =
      await response.json();


    if(!Array.isArray(berichten)){
      return;
    }


    const vak =
      document.getElementById(
        'chatberichten'
      );


    if(berichten.length === 0){

      vak.innerHTML =
        '<div>Nog geen berichten. Start de chat!</div>';

      return;

    }


    const onderaan =
      vak.scrollHeight -
      vak.scrollTop -
      vak.clientHeight < 80;


    vak.innerHTML =
      berichten.map(b => `

        <div class="bericht">

          <span class="berichtnaam">
            ${e(b.name)}
          </span>

          <span class="tijd">
            ${e(b.created_at)}
          </span>

          <div>
            ${e(b.message)}
          </div>

        </div>

      `).join('');


    if(onderaan){
      vak.scrollTop =
        vak.scrollHeight;
    }

  }
  catch(fout){

    document.getElementById(
      'chatstatus'
    ).textContent =
      'Chat kan momenteel niet worden geladen.';

  }

}


async function verstuurBericht(){

  const naam =
    document
      .getElementById('chatnaam')
      .value
      .trim();

  const bericht =
    document
      .getElementById('chatbericht')
      .value
      .trim();


  const status =
    document.getElementById(
      'chatstatus'
    );


  status.textContent = '';


  if(!naam){

    status.textContent =
      'Vul eerst je naam of roepnaam in.';

    return;
  }


  if(!bericht){

    status.textContent =
      'Typ eerst een bericht.';

    return;
  }


  try{

    const response =
      await fetch('/api/chat', {

        method:'POST',

        headers:{
          'Content-Type':
            'application/json'
        },

        body:JSON.stringify({
          name:naam,
          message:bericht
        })

      });


    const resultaat =
      await response.json();


    if(!response.ok){

      status.textContent =
        resultaat.error ||
        'Bericht kon niet worden verstuurd.';

      return;

    }


    document.getElementById(
      'chatbericht'
    ).value = '';


    /* naam onthouden op deze computer */
    localStorage.setItem(
      'pocRadioChatNaam',
      naam
    );


    await laadChat();


    const vak =
      document.getElementById(
        'chatberichten'
      );

    vak.scrollTop =
      vak.scrollHeight;


  }
  catch(fout){

    status.textContent =
      'Bericht kon niet worden verstuurd.';

  }

}


/* ENTER = VERSTUREN */

document
.getElementById('chatbericht')
.addEventListener(
  'keydown',
  function(event){

    if(event.key === 'Enter'){

      event.preventDefault();

      verstuurBericht();

    }

  }
);


/* NAAM ONTHOUDEN */

const opgeslagenNaam =
  localStorage.getItem(
    'pocRadioChatNaam'
  );

if(opgeslagenNaam){

  document.getElementById(
    'chatnaam'
  ).value =
    opgeslagenNaam;

}


/* =========================
   START
========================= */

laadRadios();
laadChat();

setInterval(
  laadRadios,
  15000
);

setInterval(
  laadChat,
  5000
);

</script>

</body>
</html>
