<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wie is online? - POC RADIO BE</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{
  margin:0;
  padding:10px 8px 14px;
  background:#02080d;
  color:#fff;
  font:14px Arial,sans-serif;
}
.slogan{
  text-align:center;
  color:#5de1ff;
  font-size:25px;
  font-weight:800;
  margin:0 0 10px;
  text-shadow:0 0 12px rgba(93,225,255,.55);
}
.p{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:0;
  background:transparent;
  border:0;
  box-shadow:none;
}
.bovenkant{
  display:grid;
  grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr);
  gap:24px;
  align-items:center;
  padding:14px 28px 12px;
  margin-bottom:10px;
  background:linear-gradient(120deg,#061522 0%,#031019 45%,#000 100%);
  border:1px solid #00cfff;
  border-radius:15px;
  box-shadow:0 0 18px rgba(0,207,255,.18);
  overflow:hidden;
}
.bovenlinks,.bovenkant>*{min-width:0}
.bovenlinks h1{
  font-size:clamp(36px,4vw,62px);
  line-height:1;
  margin:0 0 14px;
  letter-spacing:1px;
}
.sub{
  width:100%;
  max-width:620px;
  padding-top:10px;
  margin:0 0 18px;
  border-top:2px solid #20c9ff;
  color:#d8e7ef;
  font-size:clamp(11px,1.25vw,16px);
  letter-spacing:3px;
  white-space:normal;
}
.bovenlinks h2{
  font-size:clamp(29px,3vw,45px);
  margin:0 0 16px;
}
.banner-rechts{
  display:block;
  width:100%;
  height:245px;
  max-height:none;
  object-fit:contain;
  background:#000;
  border:0;
  border-radius:10px;
  padding:0;
}
.zoekvak{
  width:100%;
  max-width:590px;
  padding:13px 16px;
  border:1px solid #20c9ff;
  border-radius:10px;
  background:#04111b;
  color:#fff;
  font-size:15px;
  outline:none;
}
.zoekvak:focus{box-shadow:0 0 14px rgba(32,201,255,.35)}
.tables{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:12px;
}
.tablebox{
  overflow:hidden;
  background:linear-gradient(145deg,#061522,#071a28);
  border:1px solid #00bfe9;
  border-radius:14px;
}
.tabletitle{
  padding:10px 18px;
  font-size:18px;
  font-weight:bold;
  border-bottom:1px solid #285f7a;
}
table{width:100%;border-collapse:collapse}
td,th{
  padding:9px 18px;
  border-bottom:1px solid #28506a;
  text-align:left;
  font-size:13px;
}
th{color:#c9dbe5;font-weight:normal}
.on{color:#20ef76}
.off{color:#ff6574}
.privacy{
  text-align:center;
  color:#9fb4c0;
  margin:8px 0;
  font-size:12px;
}
.chat{
  margin-top:10px;
  padding:12px 14px;
  background:linear-gradient(145deg,#061522,#04111b);
  border:1px solid #00bfe9;
  border-radius:14px;
}
.chat h2{
  color:#28ddf6;
  margin:0 0 10px;
  font-size:20px;
}
.chatberichten{
  height:110px;
  overflow-y:auto;
  background:#03121c;
  border:1px solid #28506a;
  border-radius:8px;
  padding:6px 10px;
  margin-bottom:8px;
}
.bericht{
  display:grid;
  grid-template-columns:140px 135px 1fr;
  gap:8px;
  align-items:center;
  padding:6px 4px;
  margin:0;
  border-bottom:1px solid #17445d;
  font-size:12px;
}
.berichtnaam{color:#20ef76;font-weight:bold}
.tijd{color:#8faabd;font-size:11px;margin:0}
.chatvelden{
  display:grid;
  grid-template-columns:190px 1fr 125px;
  gap:8px;
}
.chatvelden input{
  min-width:0;
  padding:10px 12px;
  border-radius:8px;
  border:1px solid #168eb7;
  background:#071a28;
  color:#fff;
  font-size:14px;
}
.chatvelden button{
  padding:10px 16px;
  border:0;
  border-radius:8px;
  background:#20ef76;
  color:#03121c;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
}
.chatvelden button:hover{opacity:.9}
.chatstatus{color:#ff6574;min-height:14px;margin-top:5px;font-size:12px}
@media(max-width:1050px){
  .bovenkant{grid-template-columns:1fr;padding:20px}
  .banner-rechts{height:auto;max-height:300px}
  .tables{grid-template-columns:1fr}
}
@media(max-width:650px){
  body{padding:8px}
  .slogan{font-size:19px}
  .bovenlinks h1{font-size:34px}
  .sub{letter-spacing:1px}
  .bovenlinks h2{font-size:28px}
  .chatvelden{grid-template-columns:1fr}
  .bericht{grid-template-columns:1fr}
  .tijd{margin-top:-3px}
  td,th{padding:8px;font-size:12px}
  .footer-links {flex-direction: column; gap: 10px;}
}

.contact{
  margin-top:10px;
  padding:14px 18px;
  text-align:center;
  background:linear-gradient(145deg,#061522,#04111b);
  border:1px solid #00bfe9;
  border-radius:14px;
  color:#c9dbe5;
}
.contact strong{
  color:#28ddf6;
  font-size:18px;
}
.contact a{
  display:inline-block;
  margin-top:8px;
  padding:9px 16px;
  border:1px solid #20c9ff;
  border-radius:8px;
  color:#5de1ff;
  text-decoration:none;
  font-weight:bold;
}
.contact a:hover{
  background:#0b2639;
  box-shadow:0 0 12px rgba(32,201,255,.25);
}
.contact .dienst{
  margin-top:8px;
  color:#9fb4c0;
  font-size:12px;
  letter-spacing:1px;
}
/* Stijl voor de onderkant van de footer */
.footer-links {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 15px;
  font-size: 12px;
}
.footer-links .credit {
  color: #9fb4c0;
}
.footer-links .credit span {
  color: #28ddf6;
  font-weight: bold;
}

</style>
</head>
<body>

<div class="slogan">ALWAYS CONNECTED BY POC RADIO BE</div>

<div class="p">
  <div class="bovenkant">
    <div class="bovenlinks">
      <h1>POC RADIO BE</h1>
      <div class="sub">VERKOOP &nbsp;•&nbsp; VERHUUR &nbsp;•&nbsp; SERVICE &nbsp;•&nbsp; SUPPORT</div>
      <h2>Wie is online?</h2>
      <input type="text" id="zoek" class="zoekvak" placeholder="🔍 Zoek op naam..." autocomplete="off">
    </div>
