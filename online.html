    <script>
        let alleGebruikers = [];

        async function laadGebruikers() {
            try {
                const response = await fetch('/api/users');
                if (response.ok) {
                    alleGebruikers = await response.json();
                    updateTabellen();
                }
            } catch (error) {
                console.error("Fout bij laden gebruikers:", error);
            }
        }

        function updateTabellen() {
            const zoekTerm = document.getElementById('search').value.toLowerCase();
            const onlineTbody = document.getElementById('online-users');
            const offlineTbody = document.getElementById('offline-users');
            
            let onlineHtml = '';
            let offlineHtml = '';

            // Veiligheidscheck voor het geval de data leeg is
            if (!Array.isArray(alleGebruikers)) {
                alleGebruikers = [];
            }

            const gefilterd = alleGebruikers.filter(u => u && u.naam && u.naam.toLowerCase().includes(zoekTerm));

            const onlineLijst = gefilterd.filter(u => u.online);
            const offlineLijst = gefilterd.filter(u => !u.online);

            if(onlineLijst.length === 0) {
                onlineHtml = '<tr><td colspan="3">Geen online radio\'s</td></tr>';
            } else {
                onlineLijst.forEach(u => {
                    onlineHtml += `<tr><td>${u.naam}</td><td class="status-online">Online</td><td>${u.laast_gezien || '-'}</td></tr>`;
                });
            }

            if(offlineLijst.length === 0) {
                offlineHtml = '<tr><td colspan="3">Geen offline radio\'s</td></tr>';
            } else {
                offlineLijst.forEach(u => {
                    offlineHtml += `<tr><td>${u.naam}</td><td class="status-offline">Offline</td><td>${u.laast_gezien || '-'}</td></tr>`;
                });
            }

            if(onlineTbody) onlineTbody.innerHTML = onlineHtml;
            if(offlineTbody) offlineTbody.innerHTML = offlineHtml;
        }

        async function laadChat() {
            try {
                const res = await fetch('/api/chat');
                if (!res.ok) return;
                const berichten = await res.json();
                const chatBox = document.getElementById('chat-box');
                if(!chatBox) return;

                if(!berichten || berichten.length === 0) {
                    chatBox.innerHTML = "Nog geen berichten. Start de chat!";
                } else {
                    chatBox.innerHTML = berichten.map(b => `<div><strong>[${b.tijd}] ${b.naam}:</strong> ${b.bericht}</div>`).join('');
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch(e) {
                console.error("Fout bij laden chat:", e);
            }
        }

        async function verstuurBericht() {
            const naamInput = document.getElementById('chat-name');
            const msgInput = document.getElementById('chat-msg');
            
            if(!naamInput || !msgInput) return;
            
            const naam = naamInput.value;
            const bericht = msgInput.value;
            if(!bericht.trim()) return;

            try {
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ naam: naam, bericht: bericht })
                });
                msgInput.value = '';
                laadChat();
            } catch (error) {
                console.error("Fout bij versturen bericht:", error);
            }
        }

        // Elke paar seconden automatisch verversen
        setInterval(laadGebruikers, 5000);
        setInterval(laadChat, 2000);
        
        // Eerste keer handmatig starten bij openen pagina
        laadGebruikers();
        laadChat();
    </script>
