<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wie is online? - POC RADIO BE</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{
  margin:0;
  padding:10px 8px 14px;
  background:#02080d;
  color:#fff;
  font:14px Arial,sans-serif;
}
.slogan{
  text-align:center;
  color:#5de1ff;
  font-size:25px;
  font-weight:800;
  margin:0 0 10px;
  text-shadow:0 0 12px rgba(93,225,255,.55);
}
.p{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:0;
  background:transparent;
  border:0;
  box-shadow:none;
}
.bovenkant{
  display:grid;
  grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr);
  gap:24px;
  align-items:center;
  padding:14px 28px 12px;
  margin-bottom:10px;
  background:linear-gradient(120deg,#061522 0%,#031019 45%,#000 100%);
  border:1px solid #00cfff;
  border-radius:15px;
  box-shadow:0 0 18px rgba(0,207,255,.18);
  overflow:hidden;
}
.bovenlinks,.bovenkant>*{min-width:0}
.bovenlinks h1{
  font-size:clamp(36px,4vw,62px);
  line-height:1;
  margin:0 0 14px;
  letter-spacing:1px;
}
.sub{
  width:100%;
  max-width:620px;
  padding-top:10px;
  margin:0 0 18px;
  border-top:2px solid #20c9ff;
  color:#d8e7ef;
  font-size:clamp(11px,1.25vw,16px);
  letter-spacing:3px;
  white-space:normal;
}
.bovenlinks h2{
  font-size:clamp(29px,3vw,45px);
  margin:0 0 16px;
}
.banner-rechts{
  display:block;
  width:100%;
  height:245px;
  max-height:none;
  object-fit:contain;
  background:#000;
  border:0;
  border-radius:10px;
  padding:0;
}
.zoekvak{
  width:100%;
  max-width:590px;
  padding:13px 16px;
  border:1px solid #20c9ff;
  border-radius:10px;
  background:#04111b;
  color:#fff;
  font-size:15px;
  outline:none;
}
.zoekvak:focus{box-shadow:0 0 14px rgba(32,201,255,.35)}
.tables{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:12px;
}
.tablebox{
  overflow:hidden;
  background:linear-gradient(145deg,#061522,#071a28);
  border:1px solid #00bfe9;
  border-radius:14px;
}
.tabletitle{
  padding:10px 18px;
  font-size:18px;
  font-weight:bold;
  border-bottom:1px solid #285f7a;
}
table{width:100%;border-collapse:collapse}
td,th{
  padding:9px 18px;
  border-bottom:1px solid #28506a;
  text-align:left;
  font-size:13px;
}
th{color:#c9dbe5;font-weight:normal}
.on{color:#20ef76}
.off{color:#ff6574}
.privacy{
  text-align:center;
  color:#9fb4c0;
  margin:8px 0;
  font-size:12px;
}
.chat{
  margin-top:10px;
  padding:12px 14px;
  background:linear-gradient(145deg,#061522,#04111b);
  border:1px solid #00bfe9;
  border-radius:14px;
}
.chat h2{
  color:#28ddf6;
  margin:0 0 10px;
  font-size:20px;
}
.chatberichten{
  height:110px;
  overflow-y:auto;
  background:#03121c;
  border:1px solid #28506a;
  border-radius:8px;
  padding:6px 10px;
  margin-bottom:8px;
}
.bericht{
  display:grid;
  grid-template-columns:140px 135px 1fr;
  gap:8px;
  align-items:center;
  padding:6px 4px;
  margin:0;
  border-bottom:1px solid #17445d;
  font-size:12px;
}
.berichtnaam{color:#20ef76;font-weight:bold}
.tijd{color:#8faabd;font-size:11px;margin:0}
.chatvelden{
  display:grid;
  grid-template-columns:190px 1fr 125px;
  gap:8px;
}
.chatvelden input{
  min-width:0;
  padding:10px 12px;
  border-radius:8px;
  border:1px solid #168eb7;
  background:#071a28;
  color:#fff;
  font-size:14px;
}
.chatvelden button{
  padding:10px 16px;
  border:0;
  border-radius:8px;
  background:#20ef76;
  color:#03121c;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
}
.chatvelden button:hover{opacity:.9}
.chatstatus{color:#ff6574;min-height:14px;margin-top:5px;font-size:12px}
@media(max-width:1050px){
  .bovenkant{grid-template-columns:1fr;padding:20px}
  .banner-rechts{height:auto;max-height:300px}
  .tables{grid-template-columns:1fr}
}
@media(max-width:650px){
  body{padding:8px}
  .slogan{font-size:19px}
  .bovenlinks h1{font-size:34px}
  .sub{letter-spacing:1px}
  .bovenlinks h2{font-size:28px}
  .chatvelden{grid-template-columns:1fr}
  .bericht{grid-template-columns:1fr}
  .tijd{margin-top:-3px}
  td,th{padding:8px;font-size:12px}
}
</style>
</head>
<body>

<div class="slogan">ALWAYS CONNECTED BY POC RADIO BE</div>

<div class="p">
  <div class="bovenkant">
    <div class="bovenlinks">
      <h1>POC RADIO BE</h1>
      <div class="sub">VERKOOP &nbsp;•&nbsp; VERHUUR &nbsp;•&nbsp; SERVICE &nbsp;•&nbsp; SUPPORT</div>
      <h2>Wie is online?</h2>
      <input type="text" id="zoek" class="zoekvak" placeholder="🔍 Zoek op naam..." autocomplete="off">
    </div>
    <img src="global-ptt.png" alt="GLOBAL-PTT POC radio's" class="banner-rechts">
  </div>

  <div class="tables">
    <div class="tablebox">
      <div class="tabletitle">🟢 Online gebruikers</div>
      <table>
        <thead><tr><th>Naam</th><th>Status</th><th>Laatst online</th></tr></thead>
        <tbody id="r1"></tbody>
      </table>
    </div>
    <div class="tablebox">
      <div class="tabletitle">🔴 Offline gebruikers</div>
      <table>
        <thead><tr><th>Naam</th><th>Status</th><th>Laatst online</th></tr></thead>
        <tbody id="r2"></tbody>
      </table>
    </div>
  </div>

  <p class="privacy">IMEI, batterij en GPS worden niet openbaar getoond.</p>

  <div class="chat">
    <h2>💬 Chat - POC RADIO BE</h2>
    <div id="chatberichten" class="chatberichten">Chat laden...</div>
    <div class="chatvelden">
      <input type="text" id="chatnaam" maxlength="40" placeholder="Naam / roepnaam">
      <input type="text" id="chatbericht" maxlength="500" placeholder="Typ hier je bericht...">
      <button onclick="verstuurBericht()">➤ Versturen</button>
    </div>
    <div id="chatstatus" class="chatstatus"></div>
  </div>
</div>

<script>
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let alleRadios=[];

function maakRijen(radios){
  return radios.map(x=>`
    <tr>
      <td>${e(x.name)}</td>
      <td class="${String(x.status).toLowerCase()==='online'?'on':'off'}">
        ${String(x.status).toLowerCase()==='online'?'🟢 Online':'🔴 Offline'}
      </td>
      <td>${e(x.last_seen||'-')}</td>
    </tr>`).join('');
}

function toonRadios(radios){
  const online=radios.filter(x=>String(x.status).toLowerCase()==='online');
  const offline=radios.filter(x=>String(x.status).toLowerCase()!=='online');

  document.getElementById('r1').innerHTML=online.length
    ? maakRijen(online)
    : '<tr><td colspan="3">Geen online radio’s.</td></tr>';

  document.getElementById('r2').innerHTML=offline.length
    ? maakRijen(offline)
    : '<tr><td colspan="3">Geen offline radio’s.</td></tr>';
}

async function laadRadios(){
  try{
    const response=await fetch('/api/public/radios');
    if(!response.ok) throw new Error('HTTP '+response.status);
    const radios=await response.json();
    alleRadios=Array.isArray(radios)?radios:[];
    zoekRadio();
  }catch(fout){
    document.getElementById('r1').innerHTML='<tr><td colspan="3">Kan de radiolijst niet laden.</td></tr>';
    document.getElementById('r2').innerHTML='';
  }
}

function zoekRadio(){
  const zoektekst=document.getElementById('zoek').value.toLowerCase().trim();
  const gevonden=!zoektekst?alleRadios:alleRadios.filter(radio=>
    String(radio.name||'').toLowerCase().includes(zoektekst)
  );
  toonRadios(gevonden);
}
document.getElementById('zoek').addEventListener('input',zoekRadio);

async function laadChat(){
  try{
    const response=await fetch('/api/chat');
    const berichten=await response.json();
    if(!Array.isArray(berichten))return;
    const vak=document.getElementById('chatberichten');
    if(berichten.length===0){
      vak.innerHTML='<div>Nog geen berichten. Start de chat!</div>';
      return;
    }
    const onderaan=vak.scrollHeight-vak.scrollTop-vak.clientHeight<80;
    vak.innerHTML=berichten.map(b=>`
      <div class="bericht">
        <span class="berichtnaam">${e(b.name)}</span>
        <span class="tijd">${e(b.created_at)}</span>
        <div>${e(b.message)}</div>
      </div>`).join('');
    if(onderaan)vak.scrollTop=vak.scrollHeight;
  }catch(fout){
    document.getElementById('chatstatus').textContent='Chat kan momenteel niet worden geladen.';
  }
}

async function verstuurBericht(){
  const naam=document.getElementById('chatnaam').value.trim();
  const bericht=document.getElementById('chatbericht').value.trim();
  const status=document.getElementById('chatstatus');
  status.textContent='';
  if(!naam){status.textContent='Vul eerst je naam of roepnaam in.';return}
  if(!bericht){status.textContent='Typ eerst een bericht.';return}
  try{
    const response=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:naam,message:bericht})
    });
    const resultaat=await response.json();
    if(!response.ok){
      status.textContent=resultaat.error||'Bericht kon niet worden verstuurd.';
      return;
    }
    document.getElementById('chatbericht').value='';
    localStorage.setItem('pocRadioChatNaam',naam);
    await laadChat();
    const vak=document.getElementById('chatberichten');
    vak.scrollTop=vak.scrollHeight;
  }catch(fout){
    status.textContent='Bericht kon niet worden verstuurd.';
  }
}

document.getElementById('chatbericht').addEventListener('keydown',function(event){
  if(event.key==='Enter'){
    event.preventDefault();
    verstuurBericht();
  }
});

const opgeslagenNaam=localStorage.getItem('pocRadioChatNaam');
if(opgeslagenNaam)document.getElementById('chatnaam').value=opgeslagenNaam;

laadRadios();
laadChat();
setInterval(laadRadios,15000);
setInterval(laadChat,5000);
</script>
</body>
</html>
