<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL-PTT - Live Status</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; display: flex; justify-content: center; }
        .dashboard-container { width: 100%; max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #333; border-bottom: 2px solid #eaeaea; padding-bottom: 10px; margin-top: 0; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #555; font-weight: bold; }
        .status-badge { padding: 5px 10px; border-radius: 12px; font-size: 0.85em; font-weight: bold; display: inline-block; }
        .online { background-color: #d4edda; color: #155724; }
        .offline { background-color: #f8d7da; color: #721c24; }
        .footer-text { margin-top: 20px; font-size: 0.85em; color: #999; text-align: center; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h2>📻 Live Radio Status</h2>
    <table>
        <thead>
            <tr>
                <th>Naam</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="gebruikers-tabel">
            <tr>
                <td colspan="2" style="text-align: center; color: #777;">Gegevens worden geladen...</td>
            </tr>
        </tbody>
    </table>
    <div class="footer-text">
        🔒 IMEI, batterij en GPS worden niet openbaar getoond.
    </div>
</div>

<script>
    async function laadDashboard() {
        try {
            // Vraag de data op bij uw eigen Python endpoint
            const response = await fetch('/api/public/radios');
            const data = await response.json();
            
            const tabelBody = document.getElementById('gebruikers-tabel');
            tabelBody.innerHTML = ''; // Maak de tabel leeg voor de update

            if (!data || data.length === 0) {
                tabelBody.innerHTML = '<tr><td colspan="2" style="text-align:center;">Geen radio\'s in database gevonden.</td></tr>';
                return;
            }

            // Loop door alle radio's uit de SQLite tabel
            data.forEach(radio => {
                // Zoek flexibel naar het naamveld, ongeacht hoofdletters in de database
                const naam = radio.name || radio.Name || radio.NAME || radio.alias || "Onbekend";
                const ruweStatus = String(radio.status || radio.Status || radio.STATUS || "Offline");
                
                // Bepaal of de status online of offline is
                const isOnline = ruweStatus.toLowerCase().includes('online') || ruweStatus.includes('🟢');
                const badgeKlasse = isOnline ? 'online' : 'offline';
                const statusTekst = isOnline ? '🟢 Online' : '🔴 Offline';

                // Maak de rij aan met uitsluitend de Naam en Status
                const rij = document.createElement('tr');
                rij.innerHTML = `
                    <td><strong>${naam}</strong></td>
                    <td><span class="status-badge ${badgeKlasse}">${statusTekst}</span></td>
                `;
                tabelBody.appendChild(rij);
            });
        } catch (error) {
            console.error("Fout bij het ophalen van radiogegevens:", error);
            document.getElementById('gebruikers-tabel').innerHTML = 
                '<tr><td colspan="2" style="text-align:center; color:red;">Fout bij verbinding met Python server.</td></tr>';
        }
    }

    // Direct uitvoeren
    laadDashboard();

    // Elke 15 seconden automatisch verversen
    setInterval(laadDashboard, 15000);
</script>

</body>
</html>
