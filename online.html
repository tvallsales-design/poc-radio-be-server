<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wie is online?</title>

<style>
body{
  background:#061522;
  color:#fff;
  font:16px Arial;
  margin:0;
}

.p{
  max-width:1400px;
  margin:30px auto;
  background:#0b2639;
  padding:25px;
  border-radius:15px;
}

/* ZOEKVAK */
.zoekvak{
  width:100%;
  max-width:500px;
  box-sizing:border-box;
  padding:14px 18px;
  margin:5px 0 25px 0;
  border:1px solid #28506a;
  border-radius:10px;
  background:#061522;
  color:#fff;
  font-size:17px;
  outline:none;
}

.zoekvak::placeholder{
  color:#9bb3c3;
}

.zoekvak:focus{
  border-color:#5de1ff;
  box-shadow:0 0 8px rgba(93,225,255,0.3);
}

.tables{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

table{
  width:100%;
  border-collapse:collapse;
}

td,th{
  padding:14px;
  border-bottom:1px solid #28506a;
  text-align:left;
}

.on{color:#5de18a}
.off{color:#ff6574}

.logo{
  display:block;
  max-width:260px;
  width:100%;
  height:auto;
  margin:30px auto;
  border-radius:12px;
}

@media(max-width:900px){
  .tables{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<h2 style="text-align:center;color:#5de1ff;font-size:28px;">
ALWAYS CONNECTED BY POC RADIO BE
</h2>

<div class="p">

  <h1>POC RADIO BE</h1>
  <h2>Wie is online?</h2>

  <!-- ZOEKFUNCTIE -->
  <input
    type="text"
    id="zoek"
    class="zoekvak"
    placeholder="🔍 Zoek op naam..."
    autocomplete="off"
  >

  <div class="tables">

    <table>
      <thead>
        <tr>
          <th>Naam</th>
          <th>Status</th>
          <th>Laatst online</th>
        </tr>
      </thead>
      <tbody id="r1"></tbody>
    </table>

    <table>
      <thead>
        <tr>
          <th>Naam</th>
          <th>Status</th>
          <th>Laatst online</th>
        </tr>
      </thead>
      <tbody id="r2"></tbody>
    </table>

  </div>

  <p>IMEI, batterij en GPS worden niet openbaar getoond.</p>

</div>

<img
  src="616338863_122119169199130837_2862670572946327472_n (1).jpg"
  alt="POC RADIO BE"
  class="logo"
>

<script>

const e = s => String(s ?? '').replace(
  /[&<>"]/g,
  c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;'
  }[c])
);

/* ALLE RADIO'S BEWAREN */
let alleRadios = [];

function maakRijen(radios){
  return radios.map(x => `
    <tr>
      <td>${e(x.name)}</td>
      <td class="${x.status === 'online' ? 'on' : 'off'}">
        ${x.status === 'online' ? '🟢 Online' : '🔴 Offline'}
      </td>
      <td>${e(x.last_seen || '-')}</td>
    </tr>
  `).join('');
}

/* RADIO'S OVER TWEE TABELLEN VERDELEN */
function toonRadios(radios){

  const helft = Math.ceil(radios.length / 2);

  const links = radios.slice(0, helft);
  const rechts = radios.slice(helft);

  if(radios.length === 0){
    document.getElementById('r1').innerHTML =
      '<tr><td colspan="3">Geen radio gevonden.</td></tr>';

    document.getElementById('r2').innerHTML = '';
    return;
  }

  document.getElementById('r1').innerHTML =
    maakRijen(links);

  document.getElementById('r2').innerHTML =
    maakRijen(rechts);
}

/* RADIO'S VAN SERVER LADEN */
async function laadRadios(){

  try{

    const response = await fetch('/api/public/radios');
    const radios = await response.json();

    alleRadios = radios;

    /* zoekopdracht behouden bij automatische update */
    zoekRadio();

  } catch(fout){

    document.getElementById('r1').innerHTML =
      '<tr><td colspan="3">Kan de radiolijst niet laden.</td></tr>';

    document.getElementById('r2').innerHTML = '';
  }
}

/* ZOEKFUNCTIE */
function zoekRadio(){

  const zoektekst =
    document.getElementById('zoek').value
      .toLowerCase()
      .trim();

  if(!zoektekst){
    toonRadios(alleRadios);
    return;
  }

  const gevonden = alleRadios.filter(radio =>
    String(radio.name || '')
      .toLowerCase()
      .includes(zoektekst)
  );

  toonRadios(gevonden);
}

/* DIRECT ZOEKEN TIJDENS TYPEN */
document
  .getElementById('zoek')
  .addEventListener('input', zoekRadio);

/* START */
laadRadios();

/* ELKE 15 SECONDEN VERNIEUWEN */
setInterval(laadRadios,15000);

</script>

</body>
</html>
