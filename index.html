<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wie is online? - POC RADIO BE</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{
  margin:0;
  padding:10px 8px 14px;
  background:#02080d;
  color:#fff;
  font:14px Arial,sans-serif;
}
.slogan{
  text-align:center;
  color:#5de1ff;
  font-size:25px;
  font-weight:800;
  margin:0 0 10px;
  text-shadow:0 0 12px rgba(93,225,255,.55);
}
.p{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:0;
}
.bovenkant{
  display:grid;
  grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr);
  gap:24px;
  align-items:center;
  padding:14px 28px 12px;
  margin-bottom:10px;
  background:linear-gradient(120deg,#061522 0%,#031019 45%,#000 100%);
  border:1px solid #00cfff;
  border-radius:15px;
  box-shadow:0 0 18px rgba(0,207,255,.18);
  overflow:hidden;
}
.bovenlinks h1{
  font-size:clamp(36px,4vw,62px);
  line-height:1;
  margin:0 0 14px;
  letter-spacing:1px;
}
.sub{
  width:100%;
  max-width:620px;
  padding-top:10px;
  margin:0 0 18px;
  border-top:2px solid #20c9ff;
  color:#d8e7ef;
  font-size:clamp(11px,1.25vw,16px);
  letter-spacing:3px;
}
.bovenlinks h2{
  font-size:clamp(29px,3vw,45px);
  margin:0 0 16px;
}
.banner-rechts{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:245px;
  background:#000;
  border-radius:10px;
  color:#20c9ff;
  font-size:24px;
  font-weight:bold;
  border: 1px solid #20c9ff;
}
.zoekvak{
  width:100%;
  max-width:590px;
  padding:13px 16px;
  border:1px solid #20c9ff;
  border-radius:10px;
  background:#04111b;
  color:#fff;
  font-size:15px;
  outline:none;
}
.zoekvak:focus{box-shadow:0 0 14px rgba(32,201,255,.35)}
.tables{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:12px;
}
.tablebox{
  overflow:hidden;
  background:linear-gradient(145deg,#061522,#071a28);
  border:1px solid #00bfe9;
  border-radius:14px;
}
.tabletitle{
  padding:10px 18px;
  font-size:18px;
  font-weight:bold;
  border-bottom:1px solid #285f7a;
}
table{width:100%;border-collapse:collapse}
td,th{
  padding:9px 18px;
  border-bottom:1px solid #28506a;
  text-align:left;
  font-size:13px;
}
th{color:#c9dbe5;font-weight:normal}
.berichtnaam{font-weight:bold; color:#fff;}
.on{color:#20ef76}
.off{color:#ff6574}
@media(max-width:1050px){
  .bovenkant{grid-template-columns:1fr;padding:20px}
  .tables{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="slogan">ALWAYS CONNECTED BY POC RADIO BE</div>

<div class="p">
  <div class="bovenkant">
    <div class="bovenlinks">
      <h1>POC RADIO BE</h1>
      <div class="sub">VERKOOP &nbsp;•&nbsp; VERHUUR &nbsp;•&nbsp; SERVICE &nbsp;•&nbsp; SUPPORT</div>
      <h2>Wie is online?</h2>
      <input type="text" id="zoek" class="zoekvak" placeholder="🔍 Zoek op naam..." onkeyup="zoekFunctie()">
    </div>
    <div class="banner-rechts">POC RADIO BE NETWORK</div>
  </div>

  <div class="tables">
    <!-- 🟢 ONLINE GEBRUIKERS TABEL -->
    <div class="tablebox">
      <div class="tabletitle" style="color:#20ef76;">🟢 Online gebruikers</div>
      <table id="online-table">
        <thead>
          <tr>
            <th>Gebruiker</th>
            <th>Status</th>
            <th>Tijd online</th>
          </tr>
        </thead>
        <tbody>
          <!-- HIER KUN JE NAMEN TOEVOEGEN DIE ONLINE ZIJN -->
          <tr>
            <td class="berichtnaam">ON0GAL repeter</td>
            <td class="on">● Online</td>
            <td>Live</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 🔴 OFFLINE GEBRUIKERS TABEL -->
    <div class="tablebox">
      <div class="tabletitle" style="color:#ff6574;">🔴 Offline gebruikers</div>
      <table id="offline-table">
        <thead>
          <tr>
            <th>Gebruiker</th>
            <th>Status</th>
            <th>Laatst gezien</th>
          </tr>
        </thead>
        <tbody>
          <!-- HIER KUN JE NAMEN TOEVOEGEN DIE OFFLINE ZIJN -->
          <tr>
            <td class="berichtnaam">0P0JPOC</td>
            <td class="off">● Offline</td>
            <td>-</td>
          </tr>
          <tr>
            <td class="berichtnaam">ON3OSI</td>
            <td class="off">● Offline</td>
            <td>-</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
function zoekFunctie() {
  let input = document.getElementById("zoek").value.toLowerCase();
  let rows = document.querySelectorAll("table tbody tr");
  rows.forEach(row => {
    let text = row.querySelector(".berichtnaam").innerText.toLowerCase();
    row.style.display = text.includes(input) ? "" : "none";
  });
}
</script>
</body>
</html>
