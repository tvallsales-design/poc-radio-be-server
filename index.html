html,body{width:100%;max-width:100%;overflow-x:hidden}

}
.bovenkant{

  align-items:center;
  padding:14px 28px 12px;

  overflow:hidden;
}
.bovenlinks h1{

  line-height:1;
  margin:0 0 14px;
  letter-spacing:1px;
}
.sub{
  width:100%;
  max-width:620px;
  padding-top:10px;
  margin:0 0 18px;
  border-top:2px solid #20c9ff;

}
.bovenlinks h2{

}
.banner-rechts{
  display:flex;
  align-items:center;

  width:100%;
  height:245px;
  background:#000;
  border-radius:10px;
  color:#20c9ff;
  font-size:24px;
  font-weight:bold;
  border: 1px solid #20c9ff;
}
.zoekvak{
  width:100%;
  max-width:590px;
  padding:13px 16px;
  border:1px solid #20c9ff;
  border-radius:10px;
  background:#04111b;
  color:#fff;
  font-size:15px;
  outline:none;
}
.zoekvak:focus{box-shadow:0 0 14px rgba(32,201,255,.35)}
.tables{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:12px;
}
.tablebox{
  overflow:hidden;
  background:linear-gradient(145deg,#061522,#071a28);
  border:1px solid #00bfe9;
  border-radius:14px;
}
.tabletitle{
  padding:10px 18px;
  font-size:18px;
  font-weight:bold;
  border-bottom:1px solid #285f7a;
}
table{width:100%;border-collapse:collapse}
td,th{
  padding:9px 18px;
  border-bottom:1px solid #28506a;
  text-align:left;
  font-size:13px;
}
th{color:#c9dbe5;font-weight:normal}
.berichtnaam{font-weight:bold; color:#fff;}
.on{color:#20ef76}
.off{color:#ff6574}
@media(max-width:1050px){
  .bovenkant{grid-template-columns:1fr;padding:20px}
  .tables{grid-template-columns:1fr}
}
