<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wie is online? - POC RADIO BE</title>
    <style>
        * { box-sizing: border-box; }
        
        body, html {
            margin: 0; 
            padding: 0; 
            width: 100%;
            background-color: #0b0f19; 
            color: #f3f4f6; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .top-banner {
            text-align: center; 
            color: #ffffff; 
            background: linear-gradient(90deg, #005580, #00bcff);
            font-size: 12px; 
            font-weight: 600;
            letter-spacing: 1.5px; 
            padding: 8px 10px;
            text-transform: uppercase;
        }

        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 30px 20px; 
        }

        /* Header Layout */
        .header-section {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #1e293b; 
            padding-bottom: 25px; 
            margin-bottom: 35px;
            gap: 20px;
        }

        .logo-area h1 { 
            color: #ffffff; 
            font-size: 28px; 
            margin: 0; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
        }

        .nav-links { 
            margin-top: 10px; 
            font-size: 13px; 
            color: #94a3b8; 
            font-weight: 500;
        }

        .nav-links span { 
            margin-right: 15px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        .brand-right-container {
            display: flex;
            align-items: center;
            gap: 15px; 
        }

        .brand-right {
            text-align: right;
        }

        .brand-right .main-title {
            color: #00bcff; 
            font-weight: 700; 
            font-size: 20px; 
            letter-spacing: 0.5px;
        }

        .brand-right .sub-title {
            font-size: 10px; 
            color: #64748b; 
            font-weight: 600; 
            letter-spacing: 1px;
        }

        .header-logo-icon {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            background: linear-gradient(135deg, #005580, #00bcff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Titel */
        .page-title { 
            font-size: 32px; 
            font-weight: 700; 
            margin: 0 0 25px 0; 
            color: #ffffff;
        }

        /* Grid Layout */
        .users-grid { 
            display: flex; 
            gap: 24px; 
            margin-bottom: 35px; 
        }

        .panel {
            flex: 1; 
            background-color: #141b2d; 
            border: 1px solid #1e293b;
            border-radius: 12px; 
            padding: 24px; 
            height: 460px; 
            display: flex; 
            flex-direction: column;
        }

        .panel-header { 
            font-size: 18px; 
            font-weight: 600; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            color: #ffffff;
        }

        .dot { 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            margin-right: 12px; 
            display: inline-block; 
        }
        
        .dot.online { background-color: #10b981; }
        .dot.offline { background-color: #ef4444; }
        
        /* Netjes scrollen binnen de panels */
        .table-wrapper { 
            flex: 1; 
            overflow-y: auto; 
            padding-right: 5px;
        }

        .table-wrapper::-webkit-scrollbar { width: 6px; }
        .table-wrapper::-webkit-scrollbar-track { background: transparent; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #243354; border-radius: 10px; }

        .status-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 14px; 
            color: #e2e8f0; 
            text-align: left; 
        }

        .status-table th { 
            padding-bottom: 12px; 
            font-weight: 600; 
            border-bottom: 2px solid #1e293b; 
            color: #94a3b8; 
            text-transform: uppercase;
            font-size: 11px;
            position: sticky;
            top: 0;
            background-color: #141b2d;
            z-index: 1;
        }

        .status-table td { 
            padding: 12px 0; 
            border-bottom: 1px solid #1e293b; 
        }

        /* Vaste kolombreedtes tegen verspringen */
        .status-table th:nth-child(1), .status-table td:nth-child(1) { width: 45%; }
        .status-table th:nth-child(2), .status-table td:nth-child(2) { width: 25%; }
        .status-table th:nth-child(3), .status-table td:nth-child(3) { width: 30%; }

        .status-online { color: #10b981; font-weight: 600; }
        .status-offline { color: #ef4444; font-weight: 600; }

        @media (max-width: 768px) {
            .header-section { flex-direction: column; align-items: flex-start; }
            .brand-right-container { width: 100%; justify-content: space-between; }
            .users-grid { flex-direction: column; }
            /* Chatbox mobiel optimalisatie */
            .chat-wrapper { width: calc(100% - 40px); right: 20px; bottom: 90px; height: 400px; }
        }

        /* LIVE CHAT BOX STYLING */
        .chat-launcher {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #005580, #00bcff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 188, 255, 0.3);
            z-index: 1000;
            transition: transform 0.2s ease;
        }
        .chat-launcher:hover {
            transform: scale(1.05);
        }

        .chat-wrapper {
            position: fixed;
            bottom: 95px;
            right: 25px;
            width: 360px;
            height: 480px;
            background-color: #141b2d;
            border: 1px solid #1e293b;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .chat-wrapper.active {
            display: flex;
        }

        .chat-header-bar {
            background: linear-gradient(90deg, #005580, #00bcff);
            color: #ffffff;
            padding: 15px 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }

        .chat-close-btn {
            cursor: pointer;
            font-size: 20px;
            opacity: 0.8;
        }
        .chat-close-btn:hover {
            opacity: 1;
        }

        .chat-logs {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #0b0f19;
        }

        .chat-logs::-webkit-scrollbar { width: 5px; }
        .chat-logs::-webkit-scrollbar-thumb { background: #243354; border-radius: 10px; }

        .chat-msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            line-height: 1.4;
        }

        .chat-msg.operator {
            background-color: #141b2d;
            color: #e2e8f0;
            align-self: flex-start;
            border: 1px solid #1e293b;
        }

        .chat-msg.client {
            background-color: #00bcff;
            color: #ffffff;
            align-self: flex-end;
            font-weight: 500;
        }

        .chat-input-container {
            display: flex;
            padding: 12px;
            background-color: #141b2d;
            border-top: 1px solid #1e293b;
            gap: 8px;
        }

        .chat-input-container input {
            flex: 1;
            background-color: #0b0f19;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        .chat-input-container input::placeholder {
            color: #475569;
        }

        .chat-input-container button {
            background: #00bcff;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-input-container button:hover {
            background: #005580;
        }
    </style>
</head>
<body>

    <div class="top-banner">Always Connected by POC Radio BE</div>

    <div class="container">
        <!-- Header -->
        <div class="header-section">
            <div class="logo-area">
                <h1>POC RADIO BE</h1>
                <div class="nav-links"><span>Verkoop</span> • <span>Verhuur</span> • <span>Service</span> • <span>Support</span> tel 0496344212</div>
            </div>
            <div class="brand-right-container">
                <div class="brand-right">
                    <div class="main-title">GLOBAL-PTT</div>
