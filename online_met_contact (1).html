<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wie is online? - POC RADIO BE</title>
    <style>
        * { box-sizing: border-box; }
        
        body, html {
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100vh; /* Zorgt dat de pagina precies in het scherm past */
            background-color: #0b0f19; 
            color: #f3f4f6; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden; /* Voorkomt scrollen op de hoofdpagina */
        }

        .top-banner {
            text-align: center; 
            color: #ffffff; 
            background: linear-gradient(90deg, #005580, #00bcff);
            font-size: 12px; 
            font-weight: 600;
            letter-spacing: 1.5px; 
            padding: 8px 10px;
            text-transform: uppercase;
        }

        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
            height: calc(100vh - 35px); /* Volledige hoogte minus de top-banner */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header Layout */
        .header-section {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #1e293b; 
            padding-bottom: 15px; 
            margin-bottom: 20px;
            gap: 20px;
        }

        .logo-area h1 { 
            color: #ffffff; 
            font-size: 26px; 
            margin: 0; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
        }

        .nav-links { 
            margin-top: 5px; 
            font-size: 13px; 
            color: #94a3b8; 
            font-weight: 500;
        }

        .nav-links span { 
            margin-right: 15px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        .brand-right-container {
            display: flex;
            align-items: center;
            gap: 15px; 
        }

        .brand-right {
            text-align: right;
        }

        .brand-right .main-title {
            color: #00bcff; 
            font-weight: 700; 
            font-size: 20px; 
            letter-spacing: 0.5px;
        }

        .brand-right .sub-title {
            font-size: 10px; 
            color: #64748b; 
            font-weight: 600; 
            letter-spacing: 1px;
        }

        .header-logo-icon {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            background: linear-gradient(135deg, #005580, #00bcff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Titel */
        .page-title { 
            font-size: 28px; 
            font-weight: 700; 
            margin: 0 0 15px 0; 
            color: #ffffff;
        }

        /* Grid Layout voor beide kolommen strak naast elkaar */
        .users-grid { 
            display: flex; 
            gap: 24px; 
            flex: 1; 
            min-height: 0; 
            margin-bottom: 15px; 
        }

        .panel {
            flex: 1; 
            background-color: #141b2d; 
            border: 1px solid #1e293b;
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            min-height: 0; 
        }

        .panel-header { 
            font-size: 18px; 
            font-weight: 600; 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            color: #ffffff;
        }

        .dot { 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            margin-right: 12px; 
            display: inline-block; 
        }
        
        .dot.online { background-color: #10b981; }
        .dot.offline { background-color: #ef4444; }
        
        /* Interne scrollbalk binnen de panels */
        .table-wrapper { 
            flex: 1; 
            overflow-y: auto; 
            padding-right: 5px;
        }

        .table-wrapper::-webkit-scrollbar { width: 6px; }
        .table-wrapper::-webkit-scrollbar-track { background: transparent; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #243354; border-radius: 10px; }

        .status-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 14px; 
            color: #e2e8f0; 
            text-align: left; 
        }

        .status-table th { 
            padding-bottom: 12px; 
            font-weight: 600; 
            border-bottom: 2px solid #1e293b; 
            color: #94a3b8; 
            text-transform: uppercase;
            font-size: 11px;
            position: sticky;
            top: 0;
            background-color: #141b2d;
            z-index: 1;
        }

        .status-table td { 
            padding: 12px 0; 
            border-bottom: 1px solid #1e293b; 
        }

        .status-table th:nth-child(1), .status-table td:nth-child(1) { width: 45%; }
        .status-table th:nth-child(2), .status-table td:nth-child(2) { width: 25%; }
        .status-table th:nth-child(3), .status-table td:nth-child(3) { width: 30%; }

        .status-online { color: #10b981; font-weight: 600; }
        .status-offline { color: #ef4444; font-weight: 600; }
        
        .info-note { 
            font-size: 11px; 
            color: #475569; 
            text-align: center; 
            margin-bottom: 15px; 
        }
        
        /* Footer Layout over 3 egale kolommen */
        .footer-section { 
            border-top: 1px solid #1e293b; 
            padding-top: 15px; 
            display: flex; 
            justify-content: space-between; 
            font-size: 12px; 
            color: #94a3b8; 
            line-height: 1.5;
            gap: 20px;
        }

        .footer-col {
            flex: 1;
        }
        .footer-col.center {
            text-align: center;
        }
        .footer-col.right {
            text-align: right;
        }

        .footer-left-sub {
            font-size: 9px; 
            color: #475569; 
            font-weight: 600; 
            margin-top: 2px;
            display: inline-block;
        }

        .footer-website-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 12px;
            display: inline-block;
            margin-top: 4px;
            font-weight: 600;
        }
        .footer-website-link:hover {
            color: #00bcff;
            text-decoration: underline;
        }

        .footer-col a { color: #00bcff; text-decoration: none; font-weight: 600; }
        .footer-col a:hover { text-decoration: underline; }

        .global-ptt-logo { color: #00bcff; font-weight: 700; }

        @media (max-width: 768px) {
            body, html { height: auto; overflow: auto; }
            .container { height: auto; }
            .header-section { flex-direction: column; align-items: flex-start; }
            .brand-right-container { width: 100%; justify-content: space-between; }
            .users-grid { flex-direction: column; }
            .footer-section { flex-direction: column; gap: 20px; text-align: center; }
            .footer-col.right { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="top-banner">Always Connected by POC Radio BE</div>

    <div class="container">
        <!-- Header -->
        <div class="header-section">
            <div class="logo-area">
                <h1>POC RADIO BE</h1>
                <div class="nav-links"><span>Verkoop</span> • <span>Verhuur</span> • <span>Service</span> • <span>Support</span></div>
            </div>
            <div class="brand-right-container">
                <div class="brand-right">
                    <div class="main-title">GLOBAL-PTT</div>
                    <div class="sub-title">NETWORK & INFRASTRUCTURE</div>
                </div>
                <div class="header-logo-icon">🌐</div>

        </div>

        <!-- Titel -->
        <div class="page-title">Wie is online?</div>

        <!-- Gebruikers Status Overzicht -->
        <div class="users-grid">

                            <tr><td><strong>ON2ACO</strong></td><td class="status-online">Online</td><td>Zojuist</td></tr>
                            <tr><td><strong>ON3BPA</strong></td><td class="status-online">Online</td><td>Zojuist</td></tr>
                            <tr><td><strong>ON7GY</strong></td><td class="status-online">Online</td><td>Zojuist</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Offline Kolom -->
            <div class="panel">
